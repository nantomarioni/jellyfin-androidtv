# Fork (pop): upstream's build, lint and test jobs only run for master/release-* and pull requests,
# so this runs the same commands for the fork's branch.
name: Pop / Build

on:
  push:
    branches:
      - pop
  pull_request:
    branches:
      - pop

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'nantomarioni' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Assemble debug APK, lint and test
        run: ./gradlew :app:assembleDebug detekt lint test
